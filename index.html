<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌺 小红花看板</title>
<link rel="shortcut icon" href="./favicon.ico"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(145deg, #fde8e0 0%, #fce4d6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .board {
            background: #fffaf5;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1), inset 0 2px 4px #ffe9da;
            width: 100%;
            height: 100%;
            padding: 16px 24px 20px;
            border: 6px solid #ffc1a6;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 4px dotted #f9b8a0;
            margin-bottom: 8px;
            flex-shrink: 0;
            gap: 10px;
        }
        .title h1 {
            font-size: 1.8rem;
            color: #b3472b;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #ffe1d4;
        }

        /* 数量总计 — 去掉背景色和边框 */
        .total-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            font-size: 1.3rem;
            font-weight: 800;
            color: #9e3d1e;
            margin-left: 4px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .total-badge .total-num {
            font-size: 1.9rem;
            color: #b6451c;
            text-shadow: 1px 1px 0 #ffe1d4;
            margin: 0 2px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .mode-badge {
            background: #ffd9cc;
            padding: 6px 14px;
            border-radius: 100px;
            font-weight: 600;
            color: #a33f23;
            font-size: 0.9rem;
            border: 2px solid #ffad8a;
            box-shadow: 0 3px 0 #b95c3e;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .mode-badge.admin-mode {
            background: #c9e9d2;
            border-color: #6abf8b;
            box-shadow: 0 3px 0 #3e8e5e;
            color: #23633c;
        }

        .password-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .password-area input {
            padding: 7px 14px;
            border-radius: 40px;
            border: 2px solid #e5b8a3;
            background: white;
            font-size: 0.9rem;
            width: 130px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .password-area input:focus {
            border-color: #ff9366;
            box-shadow: 0 0 0 2px rgba(255, 147, 102, 0.3);
        }
        .btn {
            border: none;
            background: #f9b8a0;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #4e2a1b;
            cursor: pointer;
            box-shadow: 0 3px 0 #b46b50;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 2px solid #ffefe3;
            white-space: nowrap;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b46b50;
        }
        .btn.primary {
            background: #ff9f7c;
            box-shadow: 0 3px 0 #b3512e;
            color: #2c150c;
        }
        .btn.success {
            background: #a6d9b5;
            box-shadow: 0 3px 0 #5f9c76;
            color: #1a3d28;
        }
        .btn.danger {
            background: #f4a2a2;
            box-shadow: 0 3px 0 #b85454;
            color: #3d1414;
        }
        .btn.small {
            padding: 5px 14px;
            font-size: 0.9rem;
            box-shadow: 0 2px 0 #b46b50;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 3px 0 #b46b50;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* 主内容区 — 小红花靠顶显示 */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            min-height: 0;
            overflow-y: auto;
            padding: 12px 0 0 0;
            gap: 16px;
        }

        /* 小红花网格容器 — 无背景无边框，间距加大 */
        .flower-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 40px 30px;
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 8px 0;
            min-height: 100px;
            flex-shrink: 0;
        }

        .flower-icon {
            font-size: 3.2rem;
            line-height: 1;
            filter: drop-shadow(2px 4px 4px rgba(200, 100, 50, 0.25));
            transition: transform 0.1s;
            display: inline-block;
            animation: bloom 0.3s ease backwards;
            flex-shrink: 0;
        }
        .flower-icon:hover {
            transform: scale(1.12);
        }
        @keyframes bloom {
            0% { transform: scale(0.6); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 无花时的状态 */
        .no-flower {
            font-size: 1.6rem;
            color: #b28b7a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0.7;
            padding: 20px;
            width: 100%;
            justify-content: center;
        }
        .no-flower span {
            font-size: 3.5rem;
        }

        /* 管理员操作栏 */
        .admin-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: auto;
            padding: 12px 20px;
            background: #fdf1e7;
            border-radius: 60px;
            border: 2px solid #fadbc8;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .admin-actions.hidden {
            display: none;
        }

        /* 底部提示 */
        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: #b3856e;
            font-style: italic;
            border-top: 2px solid #ffe1d4;
            padding-top: 10px;
            flex-shrink: 0;
            margin-top: 8px;
        }

        /* 滚动条美化 */
        .main-area::-webkit-scrollbar {
            width: 8px;
        }
        .main-area::-webkit-scrollbar-track {
            background: #fce4d6;
            border-radius: 10px;
        }
        .main-area::-webkit-scrollbar-thumb {
            background: #f9b8a0;
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .flower-grid {
                gap: 30px 20px;
            }
            .flower-icon {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 700px) {
            .board { padding: 12px 16px 16px; border-width: 4px; }
            .title h1 { font-size: 1.4rem; flex-wrap: wrap; }
            .total-badge { font-size: 1.1rem; }
            .total-badge .total-num { font-size: 1.5rem; }
            .flower-icon { font-size: 2.2rem; }
            .flower-grid { gap: 24px 16px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .controls { justify-content: space-between; }
            .password-area input { width: 100px; }
        }
    </style>
</head>
<body>
    <div class="board">
        <!-- 顶部工具栏 -->
        <div class="toolbar">
            <div class="title">
                <h1>
                    小红花看板
                    <span class="total-badge">
                        总计 <span id="totalCount" class="total-num">0</span> 朵
                    </span>
                </h1>
            </div>
            <div class="controls">
                <div id="modeBadge" class="mode-badge">
                    👀 游客模式
                </div>
                <div class="password-area">
                    <input type="password" id="passwordInput" placeholder="密码" value="">
                    <button class="btn primary" id="loginBtn">登录</button>
                    <button class="btn small" id="logoutBtn" style="display: none;">退出</button>
                </div>
            </div>
        </div>

        <!-- 主内容区 — 小红花靠顶显示 -->
        <div class="main-area">
            <!-- 小红花排列区（无背景无边框，大间距） -->
            <div id="flowerGrid" class="flower-grid">
                <!-- 动态渲染小红花 -->
            </div>

            <!-- 管理员操作栏 -->
            <div id="adminActions" class="admin-actions hidden">
                <button class="btn success" id="addOneBtn">➕ 增加一朵小红花</button>
                <button class="btn danger" id="subOneBtn">➖ 减少一朵小红花</button>
                <button class="btn danger" id="resetBtn">🔄 重置为0</button>
            </div>
        </div>

        <!-- 底部说明 -->
        <div class="footer-note">
            🌟 每一朵小红花都是成长的鼓励 🌟
        </div>
    </div>

    <script>
        (function() {
            // ---------- 配置 ----------
            const ADMIN_PASSWORD = "2021";   // 可修改密码

            // ---------- 数据 ----------
            let flowerCount = 0;

            // 从 localStorage 读取
            function loadData() {
                const stored = localStorage.getItem('singleFlowerCount');
                if (stored) {
                    try {
                        const parsed = parseInt(stored, 10);
                        if (!isNaN(parsed) && parsed >= 0) {
                            flowerCount = parsed;
                        }
                    } catch (e) {
                        // 使用默认0
                    }
                }
                if (typeof flowerCount !== 'number' || flowerCount < 0 || isNaN(flowerCount)) {
                    flowerCount = 0;
                }
            }

            function saveData() {
                localStorage.setItem('singleFlowerCount', flowerCount.toString());
            }

            // ---------- 状态 ----------
            let isAdmin = false;

            // ---------- DOM 元素 ----------
            const modeBadge = document.getElementById('modeBadge');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const flowerGrid = document.getElementById('flowerGrid');
            const adminActions = document.getElementById('adminActions');
            const addOneBtn = document.getElementById('addOneBtn');
            const subOneBtn = document.getElementById('subOneBtn');
            const resetBtn = document.getElementById('resetBtn');
            const totalCountEl = document.getElementById('totalCount');

            // ---------- 渲染 ----------
            function render() {
                // 更新角色UI
                if (isAdmin) {
                    modeBadge.textContent = '👑 管理员模式';
                    modeBadge.classList.add('admin-mode');
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-flex';
                    adminActions.classList.remove('hidden');
                    passwordInput.disabled = true;
                    passwordInput.value = '';
                    passwordInput.placeholder = '已登录';
                } else {
                    modeBadge.textContent = '👀 游客模式';
                    modeBadge.classList.remove('admin-mode');
                    loginBtn.style.display = 'inline-flex';
                    logoutBtn.style.display = 'none';
                    adminActions.classList.add('hidden');
                    passwordInput.disabled = false;
                    passwordInput.placeholder = '密码';
                }

                // 更新总计数量（标题徽章）
                totalCountEl.textContent = flowerCount;

                // 渲染小红花 (一朵朵显示)
                const count = flowerCount;
                const MAX_DISPLAY = 200;

                if (count === 0) {
                    flowerGrid.innerHTML = `
                        <div class="no-flower">
                            <span>🌱</span>
                            还没有小红花，加油哦！
                        </div>
                    `;
                } else {
                    const displayCount = Math.min(count, MAX_DISPLAY);
                    let flowersHtml = '';
                    for (let i = 0; i < displayCount; i++) {
                        flowersHtml += `<span class="flower-icon" style="animation-delay: ${i * 0.015}s">🌺</span>`;
                    }
                    if (count > MAX_DISPLAY) {
                        flowersHtml += `<span class="flower-icon" style="opacity:0.7; font-size:2.6rem;">…</span>`;
                    }
                    flowerGrid.innerHTML = flowersHtml;
                }
            }

            // ---------- 事件处理 ----------
            function handleLogin() {
                const pwd = passwordInput.value.trim();
                if (pwd === ADMIN_PASSWORD) {
                    isAdmin = true;
                    render();
                    passwordInput.value = '';
                } else {
                    alert('密码错误，请重试～ (提示: 柠檬生日年份)');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            function handleLogout() {
                isAdmin = false;
                render();
            }

            function addOne() {
                if (!isAdmin) return;
                flowerCount += 1;
                saveData();
                render();
            }

            function subOne() {
                if (!isAdmin) return;
                if (flowerCount > 0) {
                    flowerCount -= 1;
                    saveData();
                    render();
                } else {
                    alert('小红花不能是负数啦～');
                }
            }

            function resetCount() {
                if (!isAdmin) return;
                if (confirm('确定要把小红花重置为 0 吗？')) {
                    flowerCount = 0;
                    saveData();
                    render();
                }
            }

            // ---------- 初始化 ----------
            function init() {
                loadData();
                isAdmin = false;
                render();

                loginBtn.addEventListener('click', handleLogin);
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleLogin();
                });
                logoutBtn.addEventListener('click', handleLogout);

                addOneBtn.addEventListener('click', addOne);
                subOneBtn.addEventListener('click', subOne);
                resetBtn.addEventListener('click', resetCount);
            }

            init();
        })();
    </script>
</body>
</html>
